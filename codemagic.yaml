# Codemagic CI/CD — builds "Your Mental Coach" (Capacitor iOS) and ships to TestFlight.
# This lets you release from your Windows PC: push to GitHub, Codemagic builds on a
# cloud Mac and uploads to TestFlight automatically.
#
# ONE-TIME SETUP in the Codemagic web UI (see CODEMAGIC_SETUP.md for click-by-click):
#   1) Add an App Store Connect API key named YMC_ASC_KEY.
#      REQUIRED ROLE: "App Manager" (or Admin) — lesser roles cannot create/fetch
#      provisioning profiles and the signing step will silently fail.
#   2) APP_STORE_APP_ID is already set below (6759075246).
#
# TROUBLESHOOTING — check the failing step's log for the real error, not use-profiles:
#
#   "Cannot save Signing Certificates without certificate private key"
#     An iOS Distribution certificate exists in the Developer Portal but its private key
#     lives on another machine (e.g. the Mac you used to submit manually before).
#     Fix: revoke that certificate at developer.apple.com → Certificates, Identifiers &
#     Profiles → Certificates → iOS/Apple Distribution → Revoke. Codemagic's --create
#     flag will then generate a fresh cert + store its private key for all future builds.
#
#   "No matching profiles found" (from xcode-project use-profiles)
#     Means the fetch step above failed or downloaded nothing. Common causes:
#     a) API key role is "Developer" instead of "App Manager" → fix in App Store Connect
#     b) Bundle ID com.nconte.yourmentalcoach not registered in Certificates, IDs & Profiles
#     c) "Sign in with Apple" capability not enabled on the App ID in the Developer Portal

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: YMC_ASC_KEY        # must match the API key name in Codemagic; needs App Manager role
    environment:
      # NOTE: ios_signing block is intentionally absent.
      # Mixing ios_signing with manual fetch-signing-files scripts causes a conflict —
      # Codemagic treats them as two separate signing mechanisms and they fight each other.
      # Signing is handled entirely by the scripts below using the app_store_connect integration.
      groups:
        - ios-signing              # provides CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6759075246
      node: 22
      xcode: latest
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Build web app (Vite)
        script: npm run build
      - name: Sync web build into the iOS project
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing certificate and provisioning profile
        script: |
          set -e
          # Verify the key env var is actually set
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is empty — check that the ios-signing group is loaded"
            exit 1
          fi
          echo "Key length: ${#CERTIFICATE_PRIVATE_KEY} chars — OK"
          # Write key to file (more reliable than passing via @env: directly)
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files \
            "com.nconte.yourmentalcoach" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --create
          echo "=== Provisioning profiles downloaded ==="
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null \
            || { echo "ERROR: No .mobileprovision files found — fetch-signing-files did not download any profiles."; exit 1; }
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Set the next TestFlight build number
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "Setting build number to $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      # Uncomment to get email notifications on build success/failure:
      # email:
      #   recipients:
      #     - you@example.com
      #   notify:
      #     success: true
      #     failure: true
